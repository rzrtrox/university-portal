<!-- templates/includes/navbar.html (or directly in base.html) -->
{% load static %}

<!-- Font Awesome (if not already included in base) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<!-- Inter font (already used in profile) -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="{% static 'css/navbar/nav.css' %}">

<nav class="navbar" id="mainNav">
    <div class="nav-container">

        <!-- Logo -->
        <a href="{% url 'home' %}" class="logo">
            <div class="logo-icon"><i class="fas fa-graduation-cap"></i></div>
            <span class="logo-text">Onn<span>Campus</span></span>
        </a>

        <!-- Search (desktop) -->
        <div class="search-wrap desktop-search">
            <i class="fas fa-search search-icon"></i>
            <input type="text" placeholder="Search students, clubs, events..." id="searchInput" />
            <button class="search-clear" id="searchClear" aria-label="Clear search">
                <i class="fas fa-times-circle"></i>
            </button>
        </div>

        <!-- Desktop Menu -->
        <div class="menu desktop-menu">
            <a href="{% url 'home' %}" class="active">
                <i class="fas fa-home"></i> Home
            </a>
            <a href="/clubs">
                <i class="fas fa-users"></i> Clubs
            </a>
            <a href="#">
                <i class="fas fa-calendar-alt"></i> Events
            </a>

            <a href="#" class="notif-wrap" aria-label="Notifications">
                <i class="fas fa-bell"></i>
                <span class="notif-badge"></span>
            </a>

            <a href="#" class="avatar-link">
                {% if user.profile.profile_pic %}
                    <img src="{{profile.profile_pic.url}}" alt="Avatar" class="avatar" />
                {% else %}
                    <div class="avatar avatar-placeholder">{{ user.username|first|upper }}</div>
                {% endif %}
            </a>
        </div>

        <!-- Mobile Controls -->
        <div class="mobile-controls">
            <!-- Search toggle (mobile) -->
            <button class="search-toggle" id="searchToggle" aria-label="Toggle search">
                <i class="fas fa-search"></i>
            </button>

            <!-- Notification (mobile) -->
            <a href="#" class="notif-wrap mobile-notif">
                <i class="fas fa-bell"></i>
                <span class="notif-badge"></span>
            </a>

            <!-- Hamburger -->
            <button class="hamburger" id="hamburger" aria-label="Toggle menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>

        <!-- Mobile Search (expanded) -->
        <div class="search-wrap mobile-search" id="mobileSearch">
            <i class="fas fa-search search-icon"></i>
            <input type="text" placeholder="Search..." id="mobileSearchInput" />
            <button class="search-clear" id="mobileSearchClear" aria-label="Clear search">
                <i class="fas fa-times-circle"></i>
            </button>
        </div>

        <!-- Mobile Menu Overlay -->
        <div class="mobile-menu" id="mobileMenu">
            <a href="{% url 'home' %}" class="active">
                <i class="fas fa-home"></i> Home
            </a>
            <a href="#">
                <i class="fas fa-users"></i> Clubs
            </a>
            <a href="#">
                <i class="fas fa-calendar-alt"></i> Events
            </a>
            <a href="#" class="notif-mobile">
                <i class="fas fa-bell"></i> Notifications
                <span class="badge">3</span>
            </a>
            <div class="avatar-row">
                <div class="avatar avatar-placeholder">{{ user.username|first|upper }}</div>
                <span>{{ user.get_full_name|default:user.username }}</span>
                <a href="#" class="settings-link">
                    <i class="fas fa-cog"></i>
                </a>
            </div>
        </div>

    </div>
</nav>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        // ─── Hamburger toggle ───
        const hamburger = document.getElementById('hamburger');
        const mobileMenu = document.getElementById('mobileMenu');

        hamburger.addEventListener('click', function(e) {
            e.stopPropagation();
            this.classList.toggle('active');
            mobileMenu.classList.toggle('open');
        });

        // ─── Mobile search toggle ───
        const searchToggle = document.getElementById('searchToggle');
        const mobileSearch = document.getElementById('mobileSearch');

        searchToggle.addEventListener('click', function(e) {
            e.stopPropagation();
            mobileSearch.classList.toggle('open');
            if (mobileSearch.classList.contains('open')) {
                const input = document.getElementById('mobileSearchInput');
                setTimeout(() => input.focus(), 100);
            }
        });

        // ─── Close menus on link click ───
        const mobileLinks = mobileMenu.querySelectorAll('a');
        mobileLinks.forEach(link => {
            link.addEventListener('click', function() {
                hamburger.classList.remove('active');
                mobileMenu.classList.remove('open');
            });
        });

        // ─── Close mobile search when clicking outside ───
        document.addEventListener('click', function(e) {
            const isInside = e.target.closest('.navbar');
            if (!isInside) {
                mobileSearch.classList.remove('open');
                hamburger.classList.remove('active');
                mobileMenu.classList.remove('open');
            }
        });

        // ─── Clear search buttons ───
        function setupClear(clearBtn, input) {
            clearBtn.addEventListener('click', function() {
                input.value = '';
                input.focus();
                this.style.display = 'none';
                // trigger input event
                input.dispatchEvent(new Event('input'));
            });
            input.addEventListener('input', function() {
                clearBtn.style.display = this.value.length > 0 ? 'block' : 'none';
            });
            // Initially hide if empty
            if (input.value.length === 0) {
                clearBtn.style.display = 'none';
            }
        }

        const desktopClear = document.getElementById('searchClear');
        const desktopInput = document.getElementById('searchInput');
        if (desktopClear && desktopInput) {
            setupClear(desktopClear, desktopInput);
        }

        const mobileClear = document.getElementById('mobileSearchClear');
        const mobileInput = document.getElementById('mobileSearchInput');
        if (mobileClear && mobileInput) {
            setupClear(mobileClear, mobileInput);
        }

        // ─── Desktop active link ───
        const menuLinks = document.querySelectorAll('.desktop-menu a:not(.notif-wrap)');
        menuLinks.forEach(link => {
            link.addEventListener('click', function(e) {
                menuLinks.forEach(l => l.classList.remove('active'));
                this.classList.add('active');
            });
        });
    });
</script>
