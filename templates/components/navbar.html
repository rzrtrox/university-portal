<!-- templates/includes/navbar.html (or directly in base.html) -->
{% load static %}

<!-- Font Awesome (if not already included in base) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<!-- Inter font (already used in profile) -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />

<nav class="navbar" id="mainNav">
    <div class="nav-container">

        <!-- Logo -->
        <a href="{% url 'home' %}" class="logo">
            <div class="logo-icon"><i class="fas fa-graduation-cap"></i></div>
            <span class="logo-text">Campus<span>Connect</span></span>
        </a>

        <!-- Search (desktop) -->
        <div class="search-wrap desktop-search">
            <i class="fas fa-search search-icon"></i>
            <input type="text" placeholder="Search students, clubs, events..." id="searchInput" />
            <button class="search-clear" id="searchClear" aria-label="Clear search">
                <i class="fas fa-times-circle"></i>
            </button>
        </div>

        <!-- Desktop Menu -->
        <div class="menu desktop-menu">
            <a href="{% url 'home' %}" class="active">
                <i class="fas fa-home"></i> Home
            </a>
            <a href="#">
                <i class="fas fa-users"></i> Clubs
            </a>
            <a href="#">
                <i class="fas fa-calendar-alt"></i> Events
            </a>

            <a href="#" class="notif-wrap" aria-label="Notifications">
                <i class="fas fa-bell"></i>
                <span class="notif-badge"></span>
            </a>

            <a href="#" class="avatar-link">
                {% if user.profile.profile_pic %}
                    <img src="" alt="Avatar" class="avatar" />
                {% else %}
                    <div class="avatar avatar-placeholder">{{ user.username|first|upper }}</div>
                {% endif %}
            </a>
        </div>

        <!-- Mobile Controls -->
        <div class="mobile-controls">
            <!-- Search toggle (mobile) -->
            <button class="search-toggle" id="searchToggle" aria-label="Toggle search">
                <i class="fas fa-search"></i>
            </button>

            <!-- Notification (mobile) -->
            <a href="#" class="notif-wrap mobile-notif">
                <i class="fas fa-bell"></i>
                <span class="notif-badge"></span>
            </a>

            <!-- Hamburger -->
            <button class="hamburger" id="hamburger" aria-label="Toggle menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>

        <!-- Mobile Search (expanded) -->
        <div class="search-wrap mobile-search" id="mobileSearch">
            <i class="fas fa-search search-icon"></i>
            <input type="text" placeholder="Search..." id="mobileSearchInput" />
            <button class="search-clear" id="mobileSearchClear" aria-label="Clear search">
                <i class="fas fa-times-circle"></i>
            </button>
        </div>

        <!-- Mobile Menu Overlay -->
        <div class="mobile-menu" id="mobileMenu">
            <a href="{% url 'home' %}" class="active">
                <i class="fas fa-home"></i> Home
            </a>
            <a href="#">
                <i class="fas fa-users"></i> Clubs
            </a>
            <a href="#">
                <i class="fas fa-calendar-alt"></i> Events
            </a>
            <a href="#" class="notif-mobile">
                <i class="fas fa-bell"></i> Notifications
                <span class="badge">3</span>
            </a>
            <div class="avatar-row">
                <div class="avatar avatar-placeholder">{{ user.username|first|upper }}</div>
                <span>{{ user.get_full_name|default:user.username }}</span>
                <a href="#" class="settings-link">
                    <i class="fas fa-cog"></i>
                </a>
            </div>
        </div>

    </div>
</nav>

<style>
    /* ─── NAVBAR ROOT ─── */
    .navbar {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        background: rgba(15, 17, 23, 0.85);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-bottom: 1px solid rgba(42, 47, 58, 0.6);
        position: sticky;
        top: 0;
        z-index: 1000;
        transition: background 0.3s ease;
        padding: 0 24px;
        min-height: 72px;
        display: flex;
        align-items: center;
    }

    .nav-container {
        max-width: 1400px;
        width: 100%;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
        position: relative;
    }

    /* ─── LOGO ─── */
    .logo {
        display: flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
        flex-shrink: 0;
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -0.3px;
    }

    .logo-icon {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        background: linear-gradient(135deg, #3B82F6, #8B5CF6);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 18px;
        box-shadow: 0 6px 16px rgba(59, 130, 246, 0.25);
    }

    .logo-text {
        background: linear-gradient(to right, #F5F7FA, #A7B0C0);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }

    .logo-text span {
        font-weight: 300;
        -webkit-text-fill-color: #4F8CFF;
        background: none;
    }

    /* ─── SEARCH (desktop) ─── */
    .search-wrap {
        flex: 1;
        max-width: 480px;
        min-width: 160px;
        position: relative;
        margin: 0 8px;
    }

    .search-wrap .search-icon {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        color: #5A657A;
        font-size: 15px;
        pointer-events: none;
        transition: color 0.2s;
    }

    .search-wrap input {
        width: 100%;
        padding: 11px 18px 11px 42px;
        border: 1px solid #2A2F3A;
        border-radius: 40px;
        background: rgba(32, 37, 50, 0.55);
        color: #F5F7FA;
        font-size: 15px;
        font-weight: 400;
        font-family: 'Inter', sans-serif;
        transition: border 0.25s, box-shadow 0.25s, background 0.25s;
        outline: none;
    }

    .search-wrap input::placeholder {
        color: #5A657A;
        font-weight: 400;
    }

    .search-wrap input:focus {
        border-color: #3B82F6;
        box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.12);
        background: rgba(15, 17, 23, 0.8);
    }

    .search-wrap input:focus+.search-icon,
    .search-wrap input:focus~.search-icon {
        color: #3B82F6;
    }

    .search-clear {
        position: absolute;
        right: 14px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        color: #5A657A;
        cursor: pointer;
        font-size: 16px;
        padding: 4px;
        display: none;
        transition: color 0.2s;
    }

    .search-clear:hover {
        color: #F5F7FA;
    }

    .search-wrap input:not(:placeholder-shown)~.search-clear {
        display: block;
    }

    /* ─── DESKTOP MENU ─── */
    .desktop-menu {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
    }

    .desktop-menu a {
        color: #C9D1D9;
        text-decoration: none;
        font-weight: 500;
        font-size: 15px;
        padding: 10px 16px;
        border-radius: 40px;
        transition: all 0.2s ease;
        white-space: nowrap;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .desktop-menu a i {
        font-size: 16px;
        opacity: 0.7;
        transition: opacity 0.2s;
    }

    .desktop-menu a:hover {
        background: rgba(59, 130, 246, 0.08);
        color: #FFFFFF;
    }

    .desktop-menu a:hover i {
        opacity: 1;
    }

    .desktop-menu a.active {
        background: rgba(59, 130, 246, 0.12);
        color: #FFFFFF;
    }

    .desktop-menu a.active i {
        opacity: 1;
    }

    /* ─── NOTIFICATION ─── */
    .notif-wrap {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        transition: background 0.2s;
        cursor: pointer;
        color: #C9D1D9;
        font-size: 20px;
        text-decoration: none;
        padding: 0;
    }

    .notif-wrap:hover {
        background: rgba(59, 130, 246, 0.08);
        color: #FFFFFF;
    }

    .notif-badge {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 10px;
        height: 10px;
        background: #EF4444;
        border-radius: 50%;
        border: 2px solid #0F1117;
        animation: pulse-dot 2s infinite;
    }

    @keyframes pulse-dot {
        0% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.4); opacity: 0.7; }
        100% { transform: scale(1); opacity: 1; }
    }

    /* ─── AVATAR ─── */
    .avatar-link {
        display: flex;
        align-items: center;
        text-decoration: none;
        padding: 2px;
        border-radius: 50%;
        transition: transform 0.2s;
    }

    .avatar-link:hover {
        transform: scale(1.04);
    }

    .avatar {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid #3B82F6;
        transition: border-color 0.2s;
        background: #1C2128;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        font-weight: 600;
        color: #F5F7FA;
        flex-shrink: 0;
    }

    .avatar:hover {
        border-color: #8B5CF6;
    }

    .avatar-placeholder {
        background: linear-gradient(135deg, #3B82F6, #8B5CF6);
        color: #fff;
    }

    /* ─── MOBILE CONTROLS ─── */
    .mobile-controls {
        display: none;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
    }

    .search-toggle {
        background: none;
        border: none;
        color: #C9D1D9;
        font-size: 20px;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        cursor: pointer;
        transition: background 0.2s, color 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .search-toggle:hover {
        background: rgba(255, 255, 255, 0.04);
        color: #FFFFFF;
    }

    .mobile-notif {
        width: 44px;
        height: 44px;
        font-size: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* ─── HAMBURGER ─── */
    .hamburger {
        display: none;
        flex-direction: column;
        gap: 5px;
        cursor: pointer;
        padding: 8px 6px;
        border-radius: 10px;
        background: transparent;
        border: none;
        flex-shrink: 0;
        transition: background 0.2s;
    }

    .hamburger:hover {
        background: rgba(255, 255, 255, 0.04);
    }

    .hamburger span {
        display: block;
        width: 28px;
        height: 2.5px;
        background: #D0D7DE;
        border-radius: 4px;
        transition: all 0.25s ease;
        transform-origin: center;
    }

    .hamburger.active span:nth-child(1) {
        transform: translateY(7.5px) rotate(45deg);
        background: #3B82F6;
    }

    .hamburger.active span:nth-child(2) {
        opacity: 0;
        transform: scaleX(0);
    }

    .hamburger.active span:nth-child(3) {
        transform: translateY(-7.5px) rotate(-45deg);
        background: #3B82F6;
    }

    /* ─── MOBILE SEARCH (expanded) ─── */
    .mobile-search {
        display: none;
        flex: 1 1 100%;
        margin: 8px 0 4px;
        max-width: 100%;
        animation: slideDown 0.25s ease both;
    }

    .mobile-search.open {
        display: block;
    }

    .mobile-search input {
        padding: 10px 16px 10px 40px;
        font-size: 14px;
        border-radius: 40px;
    }

    @keyframes slideDown {
        0% { opacity: 0; transform: translateY(-8px); }
        100% { opacity: 1; transform: translateY(0); }
    }

    /* ─── MOBILE MENU ─── */
    .mobile-menu {
        display: none;
        flex-direction: column;
        background: rgba(15, 17, 23, 0.98);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        padding: 20px 24px 28px;
        border-bottom: 1px solid #2A2F3A;
        gap: 4px;
        width: 100%;
        position: absolute;
        top: 100%;
        left: 0;
        z-index: 999;
        animation: slideDown 0.3s ease both;
        border-radius: 0 0 20px 20px;
    }

    .mobile-menu.open {
        display: flex;
    }

    .mobile-menu a {
        color: #C9D1D9;
        text-decoration: none;
        font-weight: 500;
        font-size: 16px;
        padding: 14px 16px;
        border-radius: 12px;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        gap: 14px;
    }

    .mobile-menu a i {
        width: 24px;
        text-align: center;
        font-size: 18px;
        opacity: 0.7;
    }

    .mobile-menu a:hover {
        background: rgba(59, 130, 246, 0.08);
        color: #FFFFFF;
    }

    .mobile-menu a.active {
        background: rgba(59, 130, 246, 0.12);
        color: #FFFFFF;
    }

    .mobile-menu .notif-mobile {
        justify-content: space-between;
    }

    .mobile-menu .notif-mobile .badge {
        background: #EF4444;
        font-size: 12px;
        font-weight: 700;
        padding: 2px 12px;
        border-radius: 20px;
        color: #fff;
        margin-left: auto;
    }

    .mobile-menu .avatar-row {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px 16px 0;
        margin-top: 8px;
        border-top: 1px solid #2A2F3A;
    }

    .mobile-menu .avatar-row .avatar {
        width: 40px;
        height: 40px;
        font-size: 16px;
    }

    .mobile-menu .avatar-row span {
        color: #F5F7FA;
        font-weight: 600;
        flex: 1;
    }

    .mobile-menu .avatar-row .settings-link {
        color: #7B8AA3;
        font-size: 20px;
        padding: 6px;
        border-radius: 50%;
        transition: background 0.2s, color 0.2s;
    }

    .mobile-menu .avatar-row .settings-link:hover {
        background: rgba(255, 255, 255, 0.04);
        color: #F5F7FA;
    }

    /* ─── RESPONSIVE ─── */

    /* Tablets */
    @media (max-width: 900px) {
        .navbar {
            padding: 0 20px;
            min-height: 64px;
        }

        .desktop-menu {
            display: none;
        }

        .desktop-search {
            display: none;
        }

        .mobile-controls {
            display: flex;
        }

        .hamburger {
            display: flex;
        }

        .search-toggle {
            display: flex;
        }

        .logo {
            font-size: 20px;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            font-size: 16px;
        }

        .notif-wrap {
            width: 40px;
            height: 40px;
            font-size: 18px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            font-size: 16px;
        }

        .mobile-notif {
            width: 40px;
            height: 40px;
            font-size: 18px;
        }
    }

    /* Mobile */
    @media (max-width: 480px) {
        .navbar {
            padding: 0 16px;
            min-height: 56px;
        }

        .logo {
            font-size: 18px;
            gap: 8px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            font-size: 14px;
        }

        .logo-text {
            font-size: 18px;
        }

        .search-toggle {
            width: 38px;
            height: 38px;
            font-size: 17px;
        }

        .notif-wrap {
            width: 38px;
            height: 38px;
            font-size: 17px;
        }

        .avatar {
            width: 38px;
            height: 38px;
            font-size: 14px;
        }

        .mobile-notif {
            width: 38px;
            height: 38px;
            font-size: 17px;
        }

        .hamburger span {
            width: 24px;
            height: 2px;
        }

        .hamburger.active span:nth-child(1) {
            transform: translateY(6px) rotate(45deg);
        }
        .hamburger.active span:nth-child(3) {
            transform: translateY(-6px) rotate(-45deg);
        }

        .mobile-search input {
            padding: 8px 14px 8px 36px;
            font-size: 13px;
            border-radius: 30px;
        }

        .mobile-menu {
            padding: 16px 18px 22px;
        }

        .mobile-menu a {
            font-size: 15px;
            padding: 12px 14px;
        }

        .mobile-menu .avatar-row {
            padding: 12px 14px 0;
        }
    }

    /* Extra small */
    @media (max-width: 380px) {
        .logo-text {
            font-size: 16px;
        }
        .logo-icon {
            width: 28px;
            height: 28px;
            font-size: 12px;
        }
        .search-toggle {
            width: 34px;
            height: 34px;
            font-size: 15px;
        }
        .notif-wrap {
            width: 34px;
            height: 34px;
            font-size: 15px;
        }
        .mobile-notif {
            width: 34px;
            height: 34px;
            font-size: 15px;
        }
        .avatar {
            width: 34px;
            height: 34px;
            font-size: 12px;
        }
    }

    /* ─── REDUCED MOTION ─── */
    @media (prefers-reduced-motion: reduce) {
        .notif-badge {
            animation: none;
        }
        .mobile-search.open,
        .mobile-menu.open {
            animation: none;
        }
    }
</style>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        // ─── Hamburger toggle ───
        const hamburger = document.getElementById('hamburger');
        const mobileMenu = document.getElementById('mobileMenu');

        hamburger.addEventListener('click', function(e) {
            e.stopPropagation();
            this.classList.toggle('active');
            mobileMenu.classList.toggle('open');
        });

        // ─── Mobile search toggle ───
        const searchToggle = document.getElementById('searchToggle');
        const mobileSearch = document.getElementById('mobileSearch');

        searchToggle.addEventListener('click', function(e) {
            e.stopPropagation();
            mobileSearch.classList.toggle('open');
            if (mobileSearch.classList.contains('open')) {
                const input = document.getElementById('mobileSearchInput');
                setTimeout(() => input.focus(), 100);
            }
        });

        // ─── Close menus on link click ───
        const mobileLinks = mobileMenu.querySelectorAll('a');
        mobileLinks.forEach(link => {
            link.addEventListener('click', function() {
                hamburger.classList.remove('active');
                mobileMenu.classList.remove('open');
            });
        });

        // ─── Close mobile search when clicking outside ───
        document.addEventListener('click', function(e) {
            const isInside = e.target.closest('.navbar');
            if (!isInside) {
                mobileSearch.classList.remove('open');
                hamburger.classList.remove('active');
                mobileMenu.classList.remove('open');
            }
        });

        // ─── Clear search buttons ───
        function setupClear(clearBtn, input) {
            clearBtn.addEventListener('click', function() {
                input.value = '';
                input.focus();
                this.style.display = 'none';
                // trigger input event
                input.dispatchEvent(new Event('input'));
            });
            input.addEventListener('input', function() {
                clearBtn.style.display = this.value.length > 0 ? 'block' : 'none';
            });
            // Initially hide if empty
            if (input.value.length === 0) {
                clearBtn.style.display = 'none';
            }
        }

        const desktopClear = document.getElementById('searchClear');
        const desktopInput = document.getElementById('searchInput');
        if (desktopClear && desktopInput) {
            setupClear(desktopClear, desktopInput);
        }

        const mobileClear = document.getElementById('mobileSearchClear');
        const mobileInput = document.getElementById('mobileSearchInput');
        if (mobileClear && mobileInput) {
            setupClear(mobileClear, mobileInput);
        }

        // ─── Desktop active link ───
        const menuLinks = document.querySelectorAll('.desktop-menu a:not(.notif-wrap)');
        menuLinks.forEach(link => {
            link.addEventListener('click', function(e) {
                menuLinks.forEach(l => l.classList.remove('active'));
                this.classList.add('active');
            });
        });
    });
</script>
