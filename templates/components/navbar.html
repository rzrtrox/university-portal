
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0F1117;
            font-family: 'Inter', sans-serif;
            min-height: 200vh;
            padding-top: 0;
        }

        /* ── Navbar ── */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 32px;
            background: rgba(15, 17, 23, 0.82);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(42, 47, 58, 0.6);
            position: sticky;
            top: 0;
            z-index: 1000;
            transition: background 0.3s ease;
            gap: 16px;
            flex-wrap: wrap;
        }

        /* ── Logo ── */
        .logo {
            font-size: 24px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
            text-decoration: none;
        }

        .logo-icon {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            background: linear-gradient(135deg, #3B82F6, #8B5CF6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.25);
        }

        .logo-text {
            background: linear-gradient(to right, #F5F7FA, #A7B0C0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.3px;
        }

        .logo-text span {
            font-weight: 300;
            -webkit-text-fill-color: #4F8CFF;
            background: none;
        }

        /* ── Search ── */
        .search-wrap {
            flex: 1;
            max-width: 480px;
            min-width: 140px;
            margin: 0 8px;
        }

        .search-wrap input {
            width: 100%;
            padding: 12px 18px;
            border: 1px solid #2A2F3A;
            outline: none;
            border-radius: 14px;
            background: rgba(32, 37, 50, 0.55);
            color: #F5F7FA;
            font-size: 15px;
            font-weight: 400;
            transition: border 0.25s, box-shadow 0.25s, background 0.25s;
            font-family: 'Inter', sans-serif;
        }

        .search-wrap input::placeholder {
            color: #5A657A;
            font-weight: 400;
            letter-spacing: 0.2px;
        }

        .search-wrap input:focus {
            border-color: #3B82F6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.12);
            background: rgba(15, 17, 23, 0.8);
        }

        /* ── Desktop Menu ── */
        .menu {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .menu a {
            color: #C9D1D9;
            text-decoration: none;
            font-weight: 500;
            font-size: 15px;
            padding: 10px 18px;
            border-radius: 12px;
            transition: all 0.2s ease;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .menu a:hover {
            background: rgba(59, 130, 246, 0.08);
            color: #FFFFFF;
        }

        .menu a.active {
            background: rgba(59, 130, 246, 0.12);
            color: #FFFFFF;
        }

        /* ── Notification + Avatar ── */
        .notif-wrap {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            transition: background 0.2s;
            cursor: pointer;
            color: #C9D1D9;
            font-size: 22px;
            text-decoration: none;
        }

        .notif-wrap:hover {
            background: rgba(59, 130, 246, 0.08);
        }

        .notif-badge {
            position: absolute;
            top: 6px;
            right: 6px;
            width: 10px;
            height: 10px;
            background: #EF4444;
            border-radius: 50%;
            border: 2px solid #0F1117;
            animation: pulse-dot 2s infinite;
        }

        @keyframes pulse-dot {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.3);
                opacity: 0.7;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid #3B82F6;
            transition: border-color 0.2s, transform 0.2s;
            flex-shrink: 0;
            object-fit: cover;
            background: #1C2128;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 600;
            color: #F5F7FA;
        }

        .avatar:hover {
            border-color: #8B5CF6;
            transform: scale(1.04);
        }

        /* ── Hamburger ── */
        .hamburger {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            padding: 8px 4px;
            border-radius: 10px;
            transition: background 0.2s;
            background: transparent;
            border: none;
            flex-shrink: 0;
        }

        .hamburger:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        .hamburger span {
            display: block;
            width: 28px;
            height: 2.5px;
            background: #D0D7DE;
            border-radius: 4px;
            transition: all 0.25s ease;
            transform-origin: center;
        }

        .hamburger.active span:nth-child(1) {
            transform: translateY(7.5px) rotate(45deg);
            background: #3B82F6;
        }

        .hamburger.active span:nth-child(2) {
            opacity: 0;
            transform: scaleX(0);
        }

        .hamburger.active span:nth-child(3) {
            transform: translateY(-7.5px) rotate(-45deg);
            background: #3B82F6;
        }

        /* ── Mobile Menu Overlay ── */
        .mobile-menu {
            display: none;
            flex-direction: column;
            background: rgba(15, 17, 23, 0.96);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 20px 28px 30px;
            border-bottom: 1px solid #2A2F3A;
            gap: 6px;
            width: 100%;
            position: absolute;
            top: 100%;
            left: 0;
            z-index: 999;
            animation: slideDown 0.3s ease both;
        }

        .mobile-menu.open {
            display: flex;
        }

        @keyframes slideDown {
            0% {
                opacity: 0;
                transform: translateY(-12px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .mobile-menu a {
            color: #C9D1D9;
            text-decoration: none;
            font-weight: 500;
            font-size: 16px;
            padding: 14px 16px;
            border-radius: 12px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .mobile-menu a:hover {
            background: rgba(59, 130, 246, 0.08);
            color: #FFFFFF;
        }

        .mobile-menu .avatar-row {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            margin-top: 8px;
            border-top: 1px solid #2A2F3A;
        }

        .mobile-menu .avatar-row .avatar {
            width: 40px;
            height: 40px;
            font-size: 16px;
        }

        .mobile-menu .avatar-row span {
            color: #F5F7FA;
            font-weight: 600;
        }

        /* ── Responsive ── */
        @media (max-width: 920px) {
            .navbar {
                padding: 12px 20px;
            }

            .menu {
                display: none;
            }

            .hamburger {
                display: flex;
            }

            .search-wrap {
                order: 3;
                flex: 1 1 100%;
                max-width: 100%;
                margin: 4px 0 0;
            }

            .search-wrap input {
                padding: 10px 16px;
                font-size: 14px;
            }

            .logo {
                font-size: 20px;
            }

            .logo-icon {
                width: 34px;
                height: 34px;
                font-size: 15px;
            }

            .notif-wrap {
                width: 40px;
                height: 40px;
                font-size: 20px;
            }

            .avatar {
                width: 40px;
                height: 40px;
                font-size: 16px;
            }
        }

        @media (max-width: 480px) {
            .navbar {
                padding: 10px 16px;
                gap: 10px;
            }

            .logo-text {
                font-size: 18px;
            }

            .logo-icon {
                width: 30px;
                height: 30px;
                font-size: 13px;
            }

            .notif-wrap {
                width: 36px;
                height: 36px;
                font-size: 17px;
            }

            .avatar {
                width: 36px;
                height: 36px;
                font-size: 14px;
            }

            .hamburger span {
                width: 24px;
                height: 2px;
            }

            .search-wrap input {
                padding: 8px 14px;
                font-size: 13px;
                border-radius: 10px;
            }

            .mobile-menu {
                padding: 16px 18px 22px;
            }

            .mobile-menu a {
                font-size: 15px;
                padding: 12px 14px;
            }
        }

        /* ── Spacer for demo ── */
        .hero-placeholder {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 60vh;
            color: #2A2F3A;
            font-size: 18px;
            font-weight: 400;
            letter-spacing: 0.5px;
            flex-direction: column;
            gap: 12px;
        }

        .hero-placeholder strong {
            color: #4B5563;
            font-weight: 600;
        }

        .hero-placeholder .glow-line {
            width: 80px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #3B82F6, transparent);
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <!-- ─── NAVBAR ─── -->
    <nav class="navbar">

        <!-- Logo -->
        <a href="#" class="logo">
            <div class="logo-icon">🎓</div>
            <span class="logo-text">Campus<span>Connect</span></span>
        </a>

        <!-- Search -->
        <div class="search-wrap">
            <input type="text" placeholder="🔍 Search students, clubs, events..." />
        </div>

        <!-- Desktop Menu -->
        <div class="menu">
            <a href="#" class="active">🏠 Home</a>
            <a href="#">🎓 Clubs</a>
            <a href="#">📅 Events</a>

            <a href="#" class="notif-wrap">
                🔔
                <span class="notif-badge"></span>
            </a>

            <div class="avatar" title="Your profile">JD</div>
        </div>

        <!-- Hamburger -->
        <button class="hamburger" id="hamburger" aria-label="Toggle menu">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <!-- Mobile Menu -->
        <div class="mobile-menu" id="mobileMenu">
            <a href="#" class="active">🏠 Home</a>
            <a href="#">🎓 Clubs</a>
            <a href="#">📅 Events</a>
            <a href="#" style="display: flex; align-items: center; gap: 12px;">
                🔔 Notifications
                <span style="background: #EF4444; font-size: 11px; font-weight: 700; padding: 2px 10px; border-radius: 20px; color: #fff; margin-left: auto;">3</span>
            </a>
            <div class="avatar-row">
                <div class="avatar">JD</div>
                <span>John Doe</span>
                <span style="margin-left: auto; color: #4B5563; font-weight: 400; font-size: 14px;">⚙️</span>
            </div>
        </div>

    </nav>

    <!-- ─── DEMO CONTENT ─── -->
    <!-- <div class="hero-placeholder">
        <div class="glow-line"></div>
        <strong>✦ CampusConnect ✦</strong>
        <span style="color: #4B5563;">Find your vibe · rank up · stay connected</span>
        <span style="color: #2A2F3A; font-size: 14px;">↓ Scroll to see the sticky navbar in action ↓</span>
    </div> -->

    <script>
        // ── Hamburger Toggle ──
        const hamburger = document.getElementById('hamburger');
        const mobileMenu = document.getElementById('mobileMenu');

        hamburger.addEventListener('click', () => {
            hamburger.classList.toggle('active');
            mobileMenu.classList.toggle('open');
        });

        // ── Close mobile menu on link click ──
        const mobileLinks = mobileMenu.querySelectorAll('a');
        mobileLinks.forEach(link => {
            link.addEventListener('click', () => {
                hamburger.classList.remove('active');
                mobileMenu.classList.remove('open');
            });
        });

        // ── (Optional) Close on outside click ──
        document.addEventListener('click', (e) => {
            const isClickInside = e.target.closest('.navbar') || e.target.closest('.mobile-menu');
            if (!isClickInside) {
                hamburger.classList.remove('active');
                mobileMenu.classList.remove('open');
            }
        });

        // ── Demo: active state on desktop links ──
        const menuLinks = document.querySelectorAll('.menu a:not(.notif-wrap)');
        menuLinks.forEach(link => {
            link.addEventListener('click', (e) => {
                menuLinks.forEach(l => l.classList.remove('active'));
                link.classList.add('active');
            });
        });
    </script>
