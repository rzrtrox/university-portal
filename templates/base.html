<!doctype html>
<html>
  <head>
    <meta name="csrf-token" content="{{ csrf_token }}">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    {% block head %}{% endblock %}
    <style>
      body,
a,
button {
    cursor: none;
}

/* Main glowing center */
.cursor-dot {
    position: fixed;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 99999;

    background: #ffffff;

    transform: translate(-50%, -50%);

    box-shadow:
        0 0 6px #ffffff,
        0 0 14px #7c4dff,
        0 0 28px #7c4dff,
        0 0 45px rgba(124, 77, 255, 0.7);
}

/* Large slow-following glow circle */
.cursor-glow {
    position: fixed;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 99998;

    transform: translate(-50%, -50%);

    border: 1px solid rgba(124, 77, 255, 0.55);

    background: rgba(124, 77, 255, 0.07);

    box-shadow:
        0 0 15px rgba(124, 77, 255, 0.35),
        0 0 35px rgba(124, 77, 255, 0.2),
        inset 0 0 15px rgba(124, 77, 255, 0.1);

    backdrop-filter: blur(2px);
}

/* Trail particles */
.cursor-trail {
    position: fixed;
    width: 4px;
    height: 4px;

    border-radius: 50%;
    pointer-events: none;

    z-index: 99997;

    transform: translate(-50%, -50%);

    background: #7c4dff;

    box-shadow:
        0 0 7px #7c4dff,
        0 0 15px rgba(124, 77, 255, 0.8);

    animation: trailFade 0.7s ease-out forwards;
}

@keyframes trailFade {
    0% {
        opacity: 0.8;
        transform: translate(-50%, -50%) scale(1);
    }

    100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0);
    }
}
      :root {
        --bg-body: #090a0f;
        --bg-header: #0f1017;
        --bg-card: #12121a;
        --bg-card-hover: #1a1b28;
        --bg-input: #181924;
        --border-color: #1f202e;
        --accent-purple: #7c3aed;
        --accent-purple-light: #a855f7;
        --accent-purple-dark: #271d47;
        --accent-red: #ef4444;
        --text-main: #ffffff;
        --text-muted: #7e8194;
        --text-sub: #9ea1b5;
        --gold: #f59e0b;
        --radius-sm: 8px;
        --radius-md: 12px;
        --radius-lg: 16px;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family:"fredoka", "Nunito Sans", sans-serif;
      }

      body {
        background-color: var(--bg-body);
        color: var(--text-main);
        min-height: 100vh;
        overflow-x: hidden;
        padding-bottom: 3.5rem; /* Mobile bar offset */
      }
    </style>
  </head>
  <body>
    <div class="cursor-dot"></div>
    <div class="cursor-glow"></div>
    {% include 'components/navbar.html' %} {% block content %}{% endblock %}
  </body>
 <script>
const dot = document.querySelector(".cursor-dot");
const glow = document.querySelector(".cursor-glow");

let mouseX = 0;
let mouseY = 0;

let glowX = 0;
let glowY = 0;

document.addEventListener("mousemove", (e) => {

    mouseX = e.clientX;
    mouseY = e.clientY;

    /* Create trail */
    const particle = document.createElement("span");

    particle.className = "cursor-trail";

    particle.style.left = mouseX + "px";
    particle.style.top = mouseY + "px";

    document.body.appendChild(particle);

    setTimeout(() => {
        particle.remove();
    }, 700);
});


function animateCursor() {

    /*
       LOWER NUMBER = SLOWER
       0.05 = very slow
       0.08 = smooth
       0.12 = medium
       0.20 = fast
    */

    glowX += (mouseX - glowX) * 0.055;
    glowY += (mouseY - glowY) * 0.055;

    /* Center dot follows immediately */
    dot.style.left = mouseX + "px";
    dot.style.top = mouseY + "px";

    /* Outer circle follows slowly */
    glow.style.left = glowX + "px";
    glow.style.top = glowY + "px";

    requestAnimationFrame(animateCursor);
}

animateCursor();
</script>
