<!doctype html>
<html>
  <head>
    {% block head %}{% endblock %}
    <style>
      :root {
        --bg-body: #090a0f;
        --bg-header: #0f1017;
        --bg-card: #12121a;
        --bg-card-hover: #1a1b28;
        --bg-input: #181924;
        --border-color: #1f202e;
        --accent-purple: #7c3aed;
        --accent-purple-light: #a855f7;
        --accent-purple-dark: #271d47;
        --accent-red: #ef4444;
        --text-main: #ffffff;
        --text-muted: #7e8194;
        --text-sub: #9ea1b5;
        --gold: #f59e0b;
        --radius-sm: 8px;
        --radius-md: 12px;
        --radius-lg: 16px;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
      }

      body {
        background-color: var(--bg-body);
        color: var(--text-main);
        min-height: 100vh;
        overflow-x: hidden;
        padding-bottom: 3.5rem; /* Mobile bar offset */
      }
    </style>
  </head>
  <body>
    {% include 'components/navbar.html' %} {% block content %}{% endblock %}
  </body>
</html>
