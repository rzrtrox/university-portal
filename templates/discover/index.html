{% extends 'base.html' %} {% load static %} {% block content %}
<link rel="stylesheet" href="{% static 'css/home/style.css' %}" />
<style>
  /* CSS Columns masonry layout for compact card footprint */
  .pinterest-masonry {
    column-count: 2;
    column-gap: 0.5rem;
  }
  @media (min-width: 480px) {
    .pinterest-masonry {
      column-count: 3;
    }
  }
  @media (min-width: 640px) {
    .pinterest-masonry {
      column-count: 4;
    }
  }
  @media (min-width: 768px) {
    .pinterest-masonry {
      column-count: 5;
    }
  }
  @media (min-width: 1024px) {
    .pinterest-masonry {
      column-count: 4;
    }
  }
  @media (min-width: 1280px) {
    .pinterest-masonry {
      column-count: 5;
    }
  }

  /* Prevent breaking inside cards */
  .masonry-item {
    break-inside: avoid;
    margin-bottom: 0.5rem;
  }
  /* Avatar rounding isolation */
  .avatar-wrapper {
    isolation: isolate;
    border-radius: 9999px !important;
    overflow: hidden !important;
    transform: translateZ(0);
  }

  ::-webkit-scrollbar {
    width: 5px;
  }
  ::-webkit-scrollbar-track {
    background: #090d16;
  }
  ::-webkit-scrollbar-thumb {
    background: #1e293b;
    border-radius: 3px;
  }
</style>

<div class="app-layout">
    <!-- LEFT SIDEBAR -->
    {% include 'components/sidebar.html' %}

    <!-- MAIN CONTENT -->
    {% include 'components/discover/main.html' %}

    <!-- RIGHT SIDEBAR -->
    {% include 'components/right_sidebar.html' %}


</div>
<script>
  let toastTimeout;
  let activeFollowBtn = null;
  let activeName = "";

  // Prefix Search / Filter Functionality
  function filterCards() {
    const input = document.getElementById("search-input");
    const query = input.value.toLowerCase().trim();
    const clearBtn = document.getElementById("clear-btn");
    const cards = document.getElementsByClassName("masonry-item");
    const noResults = document.getElementById("no-results");
    let visibleCount = 0;

    // Toggle clear button (X) visibility
    if (query.length > 0) {
      clearBtn.classList.remove("hidden");
    } else {
      clearBtn.classList.add("hidden");
    }

    // Loop through profile cards and filter using startsWith
    for (let i = 0; i < cards.length; i++) {
      const nameEl = cards[i].querySelector(".card-name");
      const usernameEl = cards[i].querySelector(".card-username");

      const nameText = nameEl
        ? (nameEl.textContent || nameEl.innerText).trim().toLowerCase()
        : "";
      const usernameText = usernameEl
        ? (usernameEl.textContent || usernameEl.innerText).trim().toLowerCase()
        : "";

      // Remove the `@` symbol for username matching if user types without `@`
      const cleanUsername = usernameText.startsWith("@")
        ? usernameText.slice(1)
        : usernameText;

      // Split full name into words to match first name or last name starting with query
      const nameWords = nameText.split(" ");
      const matchesName = nameWords.some((word) => word.startsWith(query));

      // Match username with or without '@' prefix
      const matchesUsername =
        usernameText.startsWith(query) || cleanUsername.startsWith(query);

      if (query === "" || matchesName || matchesUsername) {
        cards[i].style.display = "";
        visibleCount++;
      } else {
        cards[i].style.display = "none";
      }
    }

    // Toggle "No Results" state
    if (visibleCount === 0) {
      noResults.classList.remove("hidden");
    } else {
      noResults.classList.add("hidden");
    }
  }

  function clearSearch() {
    const input = document.getElementById("search-input");
    input.value = "";
    filterCards();
    input.focus();
  }

  // Follow / Unfollow logic
  function toggleFollow(btn, name) {
    const icon = btn.querySelector("i");
    const text = btn.querySelector("span");

    if (btn.classList.contains("is-following")) {
      // Unfollow
      btn.classList.remove(
        "is-following",
        "bg-emerald-600",
        "hover:bg-emerald-500",
      );
      btn.classList.add("bg-indigo-600", "hover:bg-indigo-500");
      icon.className = "fa-solid fa-user-plus text-[8px]";
      text.textContent = "Follow";
      hideToast();
    } else {
      // Follow / Send Request
      btn.classList.add(
        "is-following",
        "bg-emerald-600",
        "hover:bg-emerald-500",
      );
      btn.classList.remove("bg-indigo-600", "hover:bg-indigo-500");
      icon.className = "fa-solid fa-user-check text-[8px]";
      text.textContent = "Following";

      activeFollowBtn = btn;
      activeName = name;
      showToast(`Follow request sent to ${name}`);
    }
  }

  function showToast(message) {
    const toast = document.getElementById("toast");
    const toastMsg = document.getElementById("toast-message");

    toastMsg.textContent = message;
    toast.classList.remove(
      "translate-y-20",
      "opacity-0",
      "pointer-events-none",
    );

    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => {
      hideToast();
    }, 4000);
  }

  function hideToast() {
    const toast = document.getElementById("toast");
    toast.classList.add("translate-y-20", "opacity-0", "pointer-events-none");
  }

  function undoFollow() {
    if (activeFollowBtn) {
      toggleFollow(activeFollowBtn, activeName);
    }
    hideToast();
  }
</script>

{% endblock %}
